name: Build QQGlassBar-Zygisk

on:
  workflow_dispatch:
  push: { branches: [main] }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: deps
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build cmake
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager; yes | "$SDKM" "ndk;29.0.13599879" >/dev/null 2>&1 || true

      # Payload: build on SDK37 so the kyant0 backdrop (liquid glass) variant is
      # available. Uncomment backdrop dep in payload/build.gradle.kts.
      - name: build payload (SDK 37)
        run: |
          cd payload
          ./gradlew :assembleDebug --no-daemon

      - name: build shared core engine dex
        run: |
          bash core/build_core.sh

      - name: build native + container
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          NDK_DIR="$ANDROID_HOME"/ndk/29.0.13599879
          test -d "$NDK_DIR" || { echo "missing $NDK_DIR"; ls "$ANDROID_HOME"/ndk 2>/dev/null; exit 1; }
          NDK="$NDK_DIR" bash native/build.sh
          NDK="$NDK_DIR" bash zygisk/build.sh

      - name: assemble
        run: |
          GLASS_APK="$(find payload/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -1)"
          echo "using $GLASS_APK"
          export GLASS_APK GB_VERSION=v0.1.0 GB_VERCODE=1
          bash scripts/assemble-module.sh

      - uses: actions/upload-artifact@v4
        with: { name: qqglassbar-module, path: out/qqglassbar-zygisk-*.zip }
